<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EasyRecruiter</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <header>
    <h1>EasyRecruiter</h1>
  </header>
  <main>
    <aside class="sidebar">
      <h2>Filters</h2>
      <form id="filterForm">
        <label for="names">Name:</label>
        <select name="names" id="names">
          <option value="a-z">A–Z</option>
          <option value="z-a">Z–A</option>
        </select>

        <label for="majors">Majors:</label>
        <select name="majors" id="majors">
          <option value="">--Select Major--</option>
          <option>Biology</option>
          <option>Agriculture</option>
          <option>Music</option>
          <option>Computer Science</option>
          <option>Political Science</option>
          <option>Chemistry</option>
          <option>Nursing</option>
          <option>Education</option>
          <option>Art</option>
          <option>Finance</option>
          <option>Math</option>
        </select>

        <label for="workhistory">Previous Job:</label>
        <select name="workhistory" id="workhistory">
          <option value="">--Select--</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>

        <label for="gpa">GPA:</label>
        <select name="gpa" id="gpa">
          <option value="lessthan2">Less than 2.0</option>
          <option value="lessthan3">2.0 – 3.0</option>
          <option value="lessthan3.5">3.0 – 3.5</option>
          <option value="greaterthan3.5">3.5 or Greater</option>
        </select>

        <input type="submit" value="Submit" />
      </form>
    </aside>

    <section class="main-content">
      <div class="search-section">
        <input type="text" id="searchBar" placeholder="Search profiles…" />
        <button id="searchBtn">Search</button>
      </div>

      <section id="results" class="profiles"></section>

      <pre id="output"></pre>
    </section>
  </main>

  <script src="index.js" defer></script>
</body>
</html>
