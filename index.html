<!DOCTYPE html>
<html lang="en">
<head>
  <title>Easy Recruiter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>EasyRecruiter.com</h1>
  </header>
  <main>
    <aside class="sidebar">
      <h2>Filters</h2>
      <ul>
        <li><button>Category 1</button></li>
        <li><button>Category 2</button></li>
        <li><button>Category 3</button></li>
      </ul>
    </aside>
    <section class="main-content">
      <section class="search-section">
        <input type="text" id="searchBar" placeholder="Search profiles..." />
        <button id="searchButton">Search</button>
      </section>

      <!-- Temp Profile -->
      <section class="profiles">
        <div class="profile">
          <img src="https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_960_720.png" alt="Profile Picture" class="profile-pic" />
          <div class="profile-details">
            <p><strong>John Doe</strong></p>
            <p>Software Engineer</p>
            <p>Bachelor’s in Computer Science</p>
          </div>
          <button class="profile-action">Ref.</button>
        </div>
      </section>
    </section>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
